name: Security checks

on:
  push:
    branches: [ work-space, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-audit-sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SSD_Exam_Project.sln

      - name: Build
        run: dotnet build SSD_Exam_Project.sln --configuration Release --no-restore

      - name: Dependency vulnerability audit
        run: dotnet list SSD_Exam_Project.sln package --vulnerable --include-transitive

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: dotnet CycloneDX SSD_Exam_Project.sln -o security-results/sbom -F Json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: security-results/sbom/